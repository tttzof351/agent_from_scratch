[project]
name = "agent-from-scratch"
version = "0.1.0"
description = "LLM-агент from scratch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Scripts-only repo (ch01/main.py, ...): no package to build/install.
package = false
